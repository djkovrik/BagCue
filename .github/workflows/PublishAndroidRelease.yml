name: Publish Android release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable SemVer tag to retry
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Immutable SemVer tag created by the caller
        required: true
        type: string

concurrency:
  group: publish-android-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: google-play-publishing
    steps:
      - name: Resolve requested tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Invalid SemVer tag: $tag" >&2; exit 1; }
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          (( major <= 2100 && minor < 1000 && patch < 1000 )) || { echo 'SemVer is outside versionCode mapping' >&2; exit 1; }
          code=$((major * 1000000 + minor * 1000 + patch))
          (( code > 0 && code <= 2100000000 )) || { echo 'Invalid Google Play versionCode' >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag ancestry and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git fetch origin master --no-tags
          git merge-base --is-ancestor "$TAG^{commit}" origin/master || { echo 'Tag is not on master' >&2; exit 1; }
          gh release view "$TAG" --json isPrerelease --jq '.isPrerelease' | grep -qx true
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Verify canonical hosted privacy policy
        run: python .github/workflows/scripts/validate_privacy_policy.py
      - name: Validate committed Firebase config and materialize release credentials and notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            test -n "${!name}" || { echo "Missing secret: $name" >&2; exit 1; }
          done
          test -s androidApp/google-services.json || { echo 'Missing committed Firebase config: androidApp/google-services.json' >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bagcue-upload.keystore"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-play-service-account.json"
          mkdir -p "$RUNNER_TEMP/whatsnew"
          gh release download "$TAG" --pattern 'release-notes-*.txt' --dir "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/release-notes-en-US.txt" "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          cp "$RUNNER_TEMP/release-notes-ru-RU.txt" "$RUNNER_TEMP/whatsnew/whatsnew-ru-RU"
      - name: Build signed, shrunk release
        env:
          BAGCUE_VERSION_CODE: ${{ steps.tag.outputs.code }}
          BAGCUE_VERSION_NAME: ${{ steps.tag.outputs.name }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/bagcue-upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :androidApp:verifyAndroidReleaseConfiguration
          :androidApp:verifyReleaseSigningInputs
          :androidApp:assembleRelease
          :androidApp:bundleRelease
      - name: Verify signatures, mapping and artifact structure
        env:
          APK: androidApp/build/outputs/apk/release/androidApp-release.apk
          AAB: androidApp/build/outputs/bundle/release/androidApp-release.aab
          MAPPING: androidApp/build/outputs/mapping/release/mapping.txt
        run: |
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner" || { echo 'apksigner not found' >&2; exit 1; }
          "$apksigner" verify --verbose "$APK"
          jarsigner -verify "$AAB"
          python .github/workflows/scripts/validate_release_artifacts.py "$APK" "$AAB" "$MAPPING"
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bagcue-android-${{ steps.tag.outputs.tag }}
          if-no-files-found: error
          path: |
            androidApp/build/outputs/apk/release/androidApp-release.apk
            androidApp/build/outputs/bundle/release/androidApp-release.aab
            androidApp/build/outputs/mapping/release/mapping.txt
            androidApp/build/outputs/native-debug-symbols/release/**
      - name: Publish exact AAB to Google Play Production
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJson: ${{ runner.temp }}/google-play-service-account.json
          packageName: com.sedsoftware.bagcue
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          track: production
          status: completed
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
