name: Code coverage badge

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: bagcue-coverage-badge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Measure numeric coverage
        id: coverage
        shell: bash
        run: |
          value="$(./gradlew -q printKoverLineCoverage)"
          [[ "$value" =~ ^[0-9]+\.[0-9]{2}$ ]] || { echo "Unexpected coverage output: $value" >&2; exit 1; }
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Update project-unique gist badge
        env:
          GIST_SECRET: ${{ secrets.GIST_SECRET }}
          COVERAGE_GIST_ID: ${{ vars.COVERAGE_GIST_ID }}
          COVERAGE: ${{ steps.coverage.outputs.value }}
        run: |
          test -n "$GIST_SECRET" || { echo 'Missing GIST_SECRET' >&2; exit 1; }
          test -n "$COVERAGE_GIST_ID" || { echo 'Missing COVERAGE_GIST_ID' >&2; exit 1; }
          python - <<'PY'
          import json, os, urllib.request
          value = float(os.environ['COVERAGE'])
          color = 'brightgreen' if value >= 80 else 'green' if value >= 70 else 'yellow' if value >= 60 else 'red'
          badge = {'schemaVersion': 1, 'label': 'coverage', 'message': f'{value:.2f}%', 'color': color}
          payload = json.dumps({'files': {'bagcue-coverage-badge.json': {'content': json.dumps(badge)}}}).encode()
          request = urllib.request.Request(
              f"https://api.github.com/gists/{os.environ['COVERAGE_GIST_ID']}", data=payload, method='PATCH',
              headers={'Authorization': f"Bearer {os.environ['GIST_SECRET']}", 'Accept': 'application/vnd.github+json'},
          )
          urllib.request.urlopen(request).read()
          PY
